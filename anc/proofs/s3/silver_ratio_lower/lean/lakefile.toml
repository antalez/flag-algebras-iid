name = "lean_proofs"
version = "0.1.0"
defaultTargets = ["LeanProofs"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.openClassical = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "LeanProofs"
